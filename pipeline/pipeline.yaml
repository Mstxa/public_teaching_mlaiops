# Lab 5 — provider-neutral managed training DAG.

name: itcs355-training-pipeline
schedule: "0 2 * * 0"

parameters:
  training_image: "${TRAINING_IMAGE_URI}"
  serving_image: "${SERVING_IMAGE_URI}"
  git_commit: "${GIT_COMMIT}"
  train_instance: "${TRAIN_INSTANCE}"
  staging_instance: "n1-standard-2"

steps:
  - name: ingest
    image: "${TRAINING_IMAGE_URI}"
    command:
      - python
      - scripts/make_dataset.py
      - --out
      - "{{outputs.raw_data}}"
    outputs:
      raw_data: dataset

  - name: validate
    image: "${TRAINING_IMAGE_URI}"
    command:
      - sh
      - -c
      - >-
        mkdir -p data/raw &&
        cp "$1" data/raw/sensors.csv &&
        pytest -q tests/test_data.py
      - sh
      - "{{inputs.raw_data}}"
    inputs:
      raw_data: ingest.raw_data
    depends_on: [ingest]
    on_failure: abort

  - name: train
    image: "${TRAINING_IMAGE_URI}"
    command:
      - sh
      - -c
      - >-
        mkdir -p data/raw &&
        cp "$1" data/raw/sensors.csv &&
        python -m src.train
        --model-out "$2"
        --metrics-out "$3"
      - sh
      - "{{inputs.raw_data}}"
      - "{{outputs.model}}"
      - "{{outputs.metrics}}"
    inputs:
      raw_data: ingest.raw_data
    depends_on: [validate]
    instance: "${TRAIN_INSTANCE}"
    spot: true
    outputs:
      model: model
      metrics: metrics

  - name: evaluate
    image: "${TRAINING_IMAGE_URI}"
    command:
      - python
      - scripts/evaluation_gate.py
      - --metrics
      - "{{inputs.metrics}}"
      - --decision-out
      - "{{outputs.gate_decision}}"
    inputs:
      metrics: train.metrics
    depends_on: [train]
    outputs:
      gate_decision: parameter

  - name: register
    image: "${TRAINING_IMAGE_URI}"
    command:
      - python
      - scripts/register.py
      - --model
      - "{{inputs.model}}"
      - --metrics
      - "{{inputs.metrics}}"
      - --training-image
      - "{{parameters.training_image}}"
      - --training-job-id
      - "{{runtime.pipeline_job_name}}"
      - --git-commit
      - "{{parameters.git_commit}}"
      - --version-out
      - "{{outputs.version}}"
    inputs:
      model: train.model
      metrics: train.metrics
    depends_on: [evaluate]
    condition: "evaluate.gate_decision == 'pass'"
    outputs:
      version: artifact

  - name: deploy_staging
    image: "${TRAINING_IMAGE_URI}"
    command:
      - python
      - scripts/deploy.py
      - --version-file
      - "{{inputs.version}}"
      - --serving-image
      - "{{parameters.serving_image}}"
      - --target
      - staging
      - --instance
      - "{{parameters.staging_instance}}"
      - --out
      - "{{outputs.deployment}}"
    inputs:
      version: register.version
    depends_on: [register]
    outputs:
      deployment: artifact

tags:
  course: itcs355
  student: "${PROJECT_ID}"
  lab: "5"
